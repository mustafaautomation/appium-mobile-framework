name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  build:
    name: Build & Unit Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '${{ matrix.java }}', distribution: 'temurin', cache: 'maven' }
      - name: Compile (incl. device tests)
        run: mvn -B -q compile test-compile
      # Device tests need an emulator and Appium server, so CI runs the unit suite only.
      - name: Unit tests
        run: mvn -B test
