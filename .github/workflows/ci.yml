name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - name: Compile (incl. device tests)
        run: mvn -B -q compile test-compile
      # Device tests need an emulator and Appium server, so CI runs the unit suite only.
      - name: Unit tests
        run: mvn -B test
